name: gocart
description: "GoCart - Mini E-Commerce App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.9.1
  flutter_riverpod: ^3.3.2
  image_picker: ^1.2.2
  shared_preferences: ^2.5.5
  razorpay_flutter: ^1.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
